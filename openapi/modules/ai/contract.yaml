paths:
  /api/ai/assistant/invocations:
    post:
      operationId: invokeAiAssistant
      summary: Invoke the AI assistant synchronously with an effective READ capability catalogue
      description: >-
        Authenticate first, then require the ai.assistant.invoke functional
        permission, then enforce the erbas.ai module availability/enabled state,
        and only then validate the closed message body. The assistant may expose
        only effective registered READ capabilities currently visible to the
        authenticated user; WRITE capabilities and external/built-in tools are
        never exposed. Effective READ capabilities are discovered through
        CORE-CAP-001 and executed through CORE-CAP-002. Treat model tool requests
        as untrusted input: re-evaluate module availability and user permissions
        for every CORE invocation, never bypass CORE, and never grant a business
        permission through ai.assistant.invoke. Successful toolsUsed entries
        preserve execution order and contain only the capability ID and successful
        CORE invocation ID; failed or denied CORE attempts are not exposed. The AI
        invocation ID is generated by the server and distinct from CORE IDs. Do
        not expose tool input/output, prompts, reasoning, provider requests or
        responses, credentials, provider names, upstream errors, model internals
        or implementation details. Current ERBAS business state must be obtained
        through a relevant capability or the assistant must state that it cannot
        obtain it; model knowledge is not a substitute. Enforce a finite
        server-controlled execution and tool-call budget; it is not caller state.
        Temporary provider/assistant unavailability is safely retryable; malformed
        provider output, exhausted internal budget or unrecoverable orchestration
        or tool failure is a safe assistant execution failure. All responses are
        strict JSON with Cache-Control no-store; no redirects. Only 401 includes
        WWW-Authenticate Bearer; other responses omit it. Audit the AI invocation
        and link successful CORE invocation IDs without logging full messages,
        prompts, responses, capability input/output or credentials by default.
        See docs/modules/ai/ai-001.md.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/AiAssistantInvocationRequest'
      responses:
        '200':
          $ref: '#/responses/AiAssistantInvocation'
        '400':
          $ref: '#/responses/AiAssistantInvalidRequest'
        '401':
          $ref: '../../common/errors.yaml#/responses/Unauthorized'
        '403':
          $ref: '#/responses/AiAssistantForbidden'
        '500':
          $ref: '#/responses/AiAssistantExecutionFailed'
        '503':
          description: erbas.ai is disabled, or the assistant/provider is temporarily unavailable; clients may retry the latter. No Retry-After header. WWW-Authenticate must be absent.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../../common/errors.yaml#/schemas/ModuleDisabled'
                  - $ref: '#/schemas/AiAssistantUnavailable'
responses:
  AiAssistantInvalidRequest:
    description: Malformed JSON or a structurally invalid assistant request after authorization and module gating. WWW-Authenticate must be absent.
    headers:
      Cache-Control:
        required: true
        schema: {type: string, const: no-store}
    content:
      application/json:
        schema:
          $ref: '../../common/errors.yaml#/schemas/InvalidLoginRequest'
  AiAssistantForbidden:
    description: Authenticated user does not possess ai.assistant.invoke. WWW-Authenticate must be absent.
    headers:
      Cache-Control:
        required: true
        schema: {type: string, const: no-store}
    content:
      application/json:
        schema:
          $ref: '../../common/errors.yaml#/schemas/Forbidden'
  AiAssistantInvocation:
    description: Synchronous assistant answer with only successful CORE READ tool usage. WWW-Authenticate is absent.
    headers:
      Cache-Control:
        required: true
        schema: {type: string, const: no-store}
    content:
      application/json:
        schema:
          $ref: '#/schemas/AiAssistantInvocation'
  AiAssistantExecutionFailed:
    description: Safe assistant execution failure; no provider, prompt, model, tool payload or internal details. WWW-Authenticate is absent.
    headers:
      Cache-Control:
        required: true
        schema: {type: string, const: no-store}
    content:
      application/json:
        schema:
          $ref: '#/schemas/AiAssistantExecutionFailed'
schemas:
  AiAssistantInvocationRequest:
    type: object
    additionalProperties: false
    required: [message]
    description: Exactly message; no history, provider/model selection, prompts, tools, identity, permissions, module state or execution context.
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 4000
        pattern: '\S'
        not:
          pattern: '[\u0000\uD800-\uDFFF]'
        description: >-
          Required user message. Reject empty, whitespace-only, NUL and unpaired
          surrogates. Maximum 4000 Unicode scalar values. No conversation
          history or caller-supplied execution state is accepted.
  AiAssistantInvocation:
    type: object
    additionalProperties: false
    required: [invocationId, answer, toolsUsed]
    properties:
      invocationId:
        type: string
        minLength: 1
        description: Server-generated nonempty opaque AI invocation identifier; no prescribed format and distinct from CORE capability invocation IDs.
      answer:
        type: string
        minLength: 1
        description: Nonempty assistant answer. Natural-language content is not contractually prescribed; it must not disclose provider or internal details.
      toolsUsed:
        type: array
        description: Always present, possibly empty. Successful CORE READ capability invocations in execution order; no inputs, outputs, prompts, reasoning or provider metadata.
        items:
          $ref: '#/schemas/AiAssistantToolUsage'
  AiAssistantToolUsage:
    type: object
    additionalProperties: false
    required: [capabilityId, invocationId]
    properties:
      capabilityId:
        $ref: '../../core/capabilities/contract.yaml#/schemas/CapabilityId'
      invocationId:
        type: string
        minLength: 1
        description: Successful CORE-CAP-002 invocation identifier; opaque, nonempty and distinct from the AI invocation ID.
  AiAssistantUnavailable:
    allOf:
      - $ref: '../../common/errors.yaml#/schemas/ErrorResponse'
      - properties:
          code:
            const: assistant_unavailable
          errors:
            minItems: 1
            maxItems: 1
            items:
              allOf:
                - $ref: '../../common/errors.yaml#/schemas/ErrorDetail'
                - properties:
                    code:
                      const: assistant_unavailable
  AiAssistantExecutionFailed:
    allOf:
      - $ref: '../../common/errors.yaml#/schemas/ErrorResponse'
      - properties:
          code:
            const: assistant_execution_failed
          errors:
            minItems: 1
            maxItems: 1
            items:
              allOf:
                - $ref: '../../common/errors.yaml#/schemas/ErrorDetail'
                - properties:
                    code:
                      const: assistant_execution_failed
