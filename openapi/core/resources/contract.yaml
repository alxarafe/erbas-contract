parameters:
  ResourceName:
    name: "resource"
    in: "path"
    required: true
    schema:
      type: "string"
      minLength: 1
  ResourceId:
    name: "id"
    in: "path"
    required: true
    schema:
      type: "string"
      minLength: 1
    description: "URI text encoding of the metadata-declared ID scalar; preserve opaque identity."
  ResourceActionName:
    name: "action"
    in: "path"
    required: true
    schema:
      type: "string"
      minLength: 1
schemas:
  ResourceScalar:
    type:
      - "string"
      - "number"
      - "boolean"
      - "null"
  ResourceIdentifier:
    type:
      - "string"
      - "integer"
  ResourceRecord:
    type: "object"
    additionalProperties:
      $ref: "#/schemas/ResourceScalar"
    description: "Flat scalar properties defined by the resource metadata; unknown input properties are invalid."
  ResourcePage:
    type: "object"
    additionalProperties: false
    required:
      - "items"
      - "offset"
      - "limit"
    properties:
      items:
        type: "array"
        items:
          $ref: "#/schemas/ResourceRecord"
      offset:
        type: "integer"
        minimum: 0
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
      total:
        type: "integer"
        minimum: 0
    description: "Separate from existing shared collections: total is optional and omitted when unavailable; no order member. Count, when present, precedes paging."
  ResourceFilter:
    type: "object"
    additionalProperties: false
    required:
      - "field"
      - "operator"
      - "value"
    properties:
      field:
        type: "string"
        minLength: 1
      operator:
        type: "string"
        enum:
          - "eq"
          - "ne"
          - "lt"
          - "lte"
          - "gt"
          - "gte"
          - "contains"
          - "startsWith"
      value:
        $ref: "#/schemas/ResourceScalar"
  ResourceOperation:
    type: "object"
    additionalProperties: false
    required:
      - "declared"
      - "authorized"
    properties:
      declared:
        type: "boolean"
      authorized:
        type: "boolean"
  ResourceOperations:
    type: "object"
    additionalProperties: false
    required:
      - "list"
      - "get"
      - "create"
      - "update"
      - "delete"
    properties:
      list:
        $ref: "#/schemas/ResourceOperation"
      get:
        $ref: "#/schemas/ResourceOperation"
      create:
        $ref: "#/schemas/ResourceOperation"
      update:
        $ref: "#/schemas/ResourceOperation"
      delete:
        $ref: "#/schemas/ResourceOperation"
  ResourceFieldCapabilities:
    type: "object"
    additionalProperties: false
    required:
      - "filterable"
      - "sortable"
      - "searchable"
      - "filterOperators"
    properties:
      filterable:
        type: "boolean"
      sortable:
        type: "boolean"
      searchable:
        type: "boolean"
      filterOperators:
        type: "array"
        uniqueItems: true
        items:
          type: "string"
          enum:
            - "eq"
            - "ne"
            - "lt"
            - "lte"
            - "gt"
            - "gte"
            - "contains"
            - "startsWith"
  ResourceConstraints:
    type: "object"
    additionalProperties: false
    required: []
    properties:
      minimum:
        type: "number"
      maximum:
        type: "number"
      multipleOf:
        type: "number"
      exclusiveMinimum:
        type: "boolean"
      exclusiveMaximum:
        type: "boolean"
      precision:
        type: "integer"
        minimum: 0
      scale:
        type: "integer"
        minimum: 0
      minimumLength:
        type: "integer"
        minimum: 0
      maximumLength:
        type: "integer"
        minimum: 0
      pattern:
        type: "string"
  ResourceAnnotation:
    type: "object"
    additionalProperties: false
    required:
      - "vocabulary"
      - "term"
      - "value"
    properties:
      vocabulary:
        type: "string"
        minLength: 1
      term:
        type: "string"
        minLength: 1
      value:
        oneOf:
          -
            type:
              - "string"
              - "number"
              - "boolean"
          -
            type: "array"
            items:
              type: "string"
              minLength: 1
  ResourceField:
    type: "object"
    additionalProperties: false
    required:
      - "name"
      - "type"
      - "nullable"
      - "required"
      - "readOnly"
      - "immutable"
      - "constraints"
      - "capabilities"
      - "enumValues"
      - "annotations"
    properties:
      name:
        type: "string"
        minLength: 1
      type:
        type: "string"
        enum:
          - "BOOLEAN"
          - "STRING"
          - "TEXT"
          - "INT8"
          - "UINT8"
          - "INT16"
          - "UINT16"
          - "INT32"
          - "UINT32"
          - "INT64"
          - "DECIMAL"
          - "UUID"
          - "DATE"
          - "TIME"
          - "DATETIME"
          - "ENUM"
          - "BINARY"
      nullable:
        type: "boolean"
      required:
        type: "boolean"
      readOnly:
        type: "boolean"
      immutable:
        type: "boolean"
      default:
        $ref: "#/schemas/ResourceScalar"
      constraints:
        $ref: "#/schemas/ResourceConstraints"
      capabilities:
        $ref: "#/schemas/ResourceFieldCapabilities"
      enumValues:
        type: "array"
        items:
          type: "string"
          minLength: 1
      annotations:
        type: "array"
        items:
          $ref: "#/schemas/ResourceAnnotation"
  ResourceRelation:
    type: "object"
    additionalProperties: false
    required:
      - "name"
      - "kind"
      - "targetResource"
      - "localField"
      - "targetField"
      - "displayField"
      - "required"
    properties:
      name:
        type: "string"
        minLength: 1
      kind:
        type: "string"
        enum:
          - "MANY_TO_ONE"
      targetResource:
        type: "string"
        minLength: 1
      localField:
        type: "string"
        minLength: 1
      targetField:
        type: "string"
        minLength: 1
      displayField:
        type:
          - "string"
          - "null"
      required:
        type: "boolean"
  ResourceActionParameter:
    type: "object"
    additionalProperties: false
    required:
      - "name"
      - "type"
      - "nullable"
      - "required"
      - "constraints"
      - "enumValues"
      - "annotations"
    properties:
      name:
        type: "string"
        minLength: 1
      type:
        type: "string"
        enum:
          - "BOOLEAN"
          - "STRING"
          - "TEXT"
          - "INT8"
          - "UINT8"
          - "INT16"
          - "UINT16"
          - "INT32"
          - "UINT32"
          - "INT64"
          - "DECIMAL"
          - "UUID"
          - "DATE"
          - "TIME"
          - "DATETIME"
          - "ENUM"
          - "BINARY"
      nullable:
        type: "boolean"
      required:
        type: "boolean"
      default:
        $ref: "#/schemas/ResourceScalar"
      constraints:
        $ref: "#/schemas/ResourceConstraints"
      enumValues:
        type: "array"
        items:
          type: "string"
          minLength: 1
      annotations:
        type: "array"
        items:
          $ref: "#/schemas/ResourceAnnotation"
  ResourceAction:
    type: "object"
    additionalProperties: false
    required:
      - "name"
      - "scope"
      - "requiresSelection"
      - "authorized"
      - "annotations"
      - "parameters"
    properties:
      name:
        type: "string"
        minLength: 1
      scope:
        type: "string"
        enum:
          - "ENTITY"
          - "COLLECTION"
          - "SELECTION"
      requiresSelection:
        type: "boolean"
      authorized:
        type: "boolean"
      annotations:
        type: "array"
        items:
          $ref: "#/schemas/ResourceAnnotation"
      parameters:
        type: "array"
        items:
          $ref: "#/schemas/ResourceActionParameter"
  ResourceFormGroup:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "fields"
    properties:
      id:
        type: "string"
        minLength: 1
      label:
        type: "string"
        minLength: 1
      fields:
        type: "array"
        items:
          type: "string"
          minLength: 1
  ResourceFormSection:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "collapsible"
      - "initiallyCollapsed"
      - "actions"
      - "groups"
    properties:
      id:
        type: "string"
        minLength: 1
      label:
        type: "string"
        minLength: 1
      collapsible:
        type: "boolean"
      initiallyCollapsed:
        type: "boolean"
      actions:
        type: "array"
        items:
          type: "string"
          minLength: 1
      groups:
        type: "array"
        items:
          $ref: "#/schemas/ResourceFormGroup"
  ResourceFormTab:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "actions"
      - "sections"
    properties:
      id:
        type: "string"
        minLength: 1
      label:
        type: "string"
        minLength: 1
      actions:
        type: "array"
        items:
          type: "string"
          minLength: 1
      sections:
        type: "array"
        items:
          $ref: "#/schemas/ResourceFormSection"
  ResourcePresentation:
    type: "object"
    additionalProperties: false
    required:
      - "form"
    properties:
      form:
        type: "object"
        additionalProperties: false
        required:
          - "behavior"
          - "actions"
          - "tabs"
        properties:
          behavior:
            type: "object"
            additionalProperties: false
            required:
              - "unsavedChanges"
            properties:
              unsavedChanges:
                type: "string"
                enum:
                  - "CONFIRM_DISCARD"
                  - "ALLOW_DISCARD"
          actions:
            type: "array"
            items:
              type: "string"
              minLength: 1
          tabs:
            type: "array"
            items:
              $ref: "#/schemas/ResourceFormTab"
  ResourceMetadata:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "version"
      - "moduleId"
      - "definitionHash"
      - "idDefinition"
      - "moduleEnabled"
      - "fields"
      - "relations"
      - "operations"
      - "actions"
      - "annotations"
    properties:
      id:
        type: "string"
        minLength: 1
      version:
        type: "string"
        minLength: 1
      moduleId:
        type: "string"
        minLength: 1
      definitionHash:
        type: "string"
        minLength: 1
      idDefinition:
        type: "object"
        additionalProperties: false
        required:
          - "field"
        properties:
          field:
            type: "string"
            minLength: 1
      moduleEnabled:
        type: "boolean"
      fields:
        type: "array"
        items:
          $ref: "#/schemas/ResourceField"
      relations:
        type: "array"
        items:
          $ref: "#/schemas/ResourceRelation"
      operations:
        $ref: "#/schemas/ResourceOperations"
      actions:
        type: "array"
        items:
          $ref: "#/schemas/ResourceAction"
      annotations:
        type: "array"
        items:
          $ref: "#/schemas/ResourceAnnotation"
      presentation:
        $ref: "#/schemas/ResourcePresentation"
  ResourceSummary:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "version"
      - "moduleId"
      - "definitionHash"
      - "operations"
      - "metadataPath"
    properties:
      id:
        type: "string"
        minLength: 1
      version:
        type: "string"
        minLength: 1
      moduleId:
        type: "string"
        minLength: 1
      definitionHash:
        type: "string"
        minLength: 1
      operations:
        $ref: "#/schemas/ResourceOperations"
      metadataPath:
        type: "string"
        minLength: 1
  ResourceDiscovery:
    type: "array"
    items:
      $ref: "#/schemas/ResourceSummary"
  ResourceActionTarget:
    oneOf:
      -
        type: "object"
        additionalProperties: false
        required:
          - "id"
        properties:
          id:
            $ref: "#/schemas/ResourceIdentifier"
      -
        type: "object"
        additionalProperties: false
        required:
          - "ids"
        properties:
          ids:
            type: "array"
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              $ref: "#/schemas/ResourceIdentifier"
  ResourceActionExecution:
    type: "object"
    additionalProperties: false
    required: []
    properties:
      target:
        $ref: "#/schemas/ResourceActionTarget"
      parameters:
        $ref: "#/schemas/ResourceRecord"
    description: "Scope determines required target: ENTITY id, SELECTION ids, COLLECTION target absent. Required parameters/defaults follow discovered metadata."
  ResourceActionAvailabilityRequest:
    oneOf:
      -
        type: "object"
        additionalProperties: false
        required:
          - "scope"
          - "id"
        properties:
          scope:
            const: "ENTITY"
          id:
            $ref: "#/schemas/ResourceIdentifier"
      -
        type: "object"
        additionalProperties: false
        required:
          - "scope"
          - "ids"
        properties:
          scope:
            const: "SELECTION"
          ids:
            type: "array"
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              $ref: "#/schemas/ResourceIdentifier"
      -
        type: "object"
        additionalProperties: false
        required:
          - "scope"
        properties:
          scope:
            const: "COLLECTION"
  ResourceActionState:
    type: "object"
    additionalProperties: false
    required:
      - "name"
      - "authorized"
      - "available"
    properties:
      name:
        type: "string"
        minLength: 1
      authorized:
        type: "boolean"
      available:
        type: "boolean"
      unavailableReason:
        type: "string"
        maxLength: 100
  ResourceActionAvailability:
    type: "array"
    items:
      $ref: "#/schemas/ResourceActionState"
