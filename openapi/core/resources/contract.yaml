      parameters:
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            default: 0
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 50
        -
          name: "search"
          in: "query"
          schema:
            type: "string"
            minLength: 1
            maxLength: 512
          description: "Literal case-sensitive substring over searchable fields, combined with filters. No tokenization; whitespace-only invalid."
        -
          name: "sort"
          in: "query"
          style: "form"
          explode: true
          schema:
            type: "array"
            items:
              type: "string"
              minLength: 1
          description: "Repeated field names in priority order; leading - means descending. Duplicate fields are invalid."
        -
          name: "filter"
          in: "query"
          style: "form"
          explode: true
          schema:
            type: "array"
            items:
              type: "string"
          description: "Repeated URL-encoded ResourceFilter JSON objects. AND semantics; operators must be listed in field capabilities.filterOperators."
